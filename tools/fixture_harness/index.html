<!doctype html>
<!-- Static fixture harness: mounts the fragment (ui.html, copied from src/ by shoot.py) with the Hub's public
     main.css + plugin-common.css (fetched by shoot.py), a stubbed window.PLUGIN_API whose authFetch answers
     GET /config from config.json (generated by make_config.py against a scratch home) and every other call
     with {}: no compute service, no Hub token, no side effects. ?kgdev=<state> is read by the fragment itself. -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>kaggle-classification fixtures</title>
<link rel="stylesheet" href="main.css">
<link rel="stylesheet" href="plugin-common.css">
<style> body { margin: 0; } #harness-bar { font: 12px system-ui; color: #6b7280; padding: 6px 24px; border-bottom: 1px dashed #d9dce3; } </style>
</head>
<body>
<div id="harness-bar">fixture harness · <span id="hb-status">loading</span></div>
<div id="mount"></div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  window.HARNESS = { configCalls: 0, otherCalls: [] };
  window.PLUGIN_API = {
    getConfig: function (key) { return { compute_service_url: 'http://127.0.0.1:5020', dashboard_url: 'http://127.0.0.1:5015/', object_service_url: 'http://127.0.0.1:5015' }[key] || ''; },
    authFetch: function (url, opts) {
      if (url.indexOf('/config') >= 0 && !(opts && opts.method === 'POST')) { window.HARNESS.configCalls += 1; return fetch('config.json'); }
      window.HARNESS.otherCalls.push((opts && opts.method || 'GET') + ' ' + url.replace(/^.*\/api\/plugins\/kaggle-classification/, ''));
      return Promise.resolve(new Response('{}', { status: 200, headers: { 'Content-Type': 'application/json' } }));
    },
    libs: { io: null },
    context: { projectName: '' }
  };
  window.PluginJobs = {
    connect: function () {}, on: function () { return function () {}; }, track: function () { return function () {}; },
    list: function () { return Promise.resolve([]); }, start: function () { return Promise.reject(new Error('harness: no jobs')); }
  };
  fetch('ui.html').then(function (r) { return r.text(); }).then(function (html) {
    var tpl = document.createElement('template'); tpl.innerHTML = html;
    var mountEl = document.getElementById('mount');
    Array.prototype.slice.call(tpl.content.childNodes).forEach(function (n) { mountEl.appendChild(n); });
    mountEl.querySelectorAll('script').forEach(function (old) { var s = document.createElement('script'); s.textContent = old.textContent; old.parentNode.replaceChild(s, old); });
    document.getElementById('hb-status').textContent = 'fragment mounted · kgdev=' + (params.get('kgdev') || '(none)');
    window.HARNESS.mounted = true;
  });
})();
</script>
</body>
</html>
