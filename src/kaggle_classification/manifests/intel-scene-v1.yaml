# Bundled competition manifest — the LAST resort in the resolution order
# (remote -> on-disk cache -> this file). Schema v1; see manifest.py for the
# validation rules and docs/PLAN.md for the field contract.
#
# Values marked TBC are placeholders to be confirmed with the organizer before
# the competition opens; the kit{} block is pasted from tools/build_kit.py.
schema_version: 1

competition:
  id: intel-scene                      # stable CDN id; never the Kaggle slug
  slug: 3-lc-hack-nova-scene-classification-challenge   # TBC: Kaggle URL slug
  display_name: "3LC HackNova: Scene Classification Challenge"
  deadline_utc: "2026-12-31T23:59:59Z"  # TBC

classes:
  - {id: 0, name: buildings}
  - {id: 1, name: forest}
  - {id: 2, name: glacier}
  - {id: 3, name: mountain}
  - {id: 4, name: sea}
  - {id: 5, name: street}

kit:
  # Relative to this manifest's own URL on the CDN (kaggle/intel-scene/manifest.json), so
  # dev and prod serve byte-identical documents and promotion is a pure copy (PLAN A3).
  path: starter-kit/v1/
  version: v1
  # Emitted by tools/build_kit.py from the 2026-09-22 build; the shards live under this
  # prefix on the CDN once staged (RELEASING.md, kit data releases).
  shards:
    - {name: intel-scene-v1-00.zip, sha256: 70ca233f308f4bf80208bdef26f94b6eeac52e8e0a4c96c99b0f58d79f4c7072, bytes: 547781}
    - {name: intel-scene-v1-01.zip, sha256: ed72903f953a811203d1ddcc2cf7e26ffc1336a5272116f32b2e421d942b0073, bytes: 21235172}
    - {name: intel-scene-v1-02.zip, sha256: 908d7f91276a905b0d78960726c37a58d79d47878b000e83fdc04473ef1d3721, bytes: 53237641}
    - {name: intel-scene-v1-03.zip, sha256: ba5c15cf7ef839ff745d37d36462d697cf4a9a6f9633f746958ab362c4003039, bytes: 24511747}
    - {name: intel-scene-v1-04.zip, sha256: 4e5ee9903863d10352b95a104c65891a254d3faa282e7bf0385a148b6068b0c2, bytes: 14208813}

splits:
  train:
    labeled_per_class: 100
    undefined: 6000
  val:
    per_class: 200
    editable: true
  test:
    count: 1800
    ids_from: sample_submission.csv

model:
  arch: resnet18
  pretrained: false
  image_size: 150

training:
  defaults:
    epochs: 10
    batch_size: 16
    lr: 0.0001
    weight_decay: 0.0
    optimizer: adam
    seed: 42
  bounds:
    epochs: [1, 50]
    batch_size: [8, 128]
    lr: [0.00001, 0.01]
    weight_decay: [0.0, 0.1]
  presets:
    quick: {epochs: 2}
    standard: {epochs: 10}
    long: {epochs: 25}
  embeddings:
    method: umap
    fallback: pca
    n_components: 3

submission:
  columns: [image_id, prediction, confidence]
  metric: accuracy
  daily_limit: 3

ui:
  loop_banner_text: "Import the kit, train, inspect and label in the Dashboard, retrain on the latest revision, predict, submit."
  help_links:
    - {label: "Competition page", url: "https://www.kaggle.com/competitions/3-lc-hack-nova-scene-classification-challenge"}
    - {label: "3LC documentation", url: "https://docs.3lc.ai"}
